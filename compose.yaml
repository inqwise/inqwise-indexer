services:
  indexer-node:
    image: inqwise/indexer-node:${INDEXER_VERSION:-0.1.0-SNAPSHOT}
    ports:
      - "3000:3000"
      - "8080:8080"
      - "8081:8081"
      - "8083:8083"
      - "8084:8084"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployment/local/indexer-node.json:/config/indexer-node.json:ro
      - ./deployment/local/vertx-options.json:/config/vertx-options.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    stop_grace_period: 15s
