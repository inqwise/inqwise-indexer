openapi: 3.0.3
info:
  title: inqwise-indexer Document Query API
  version: 0.1.0
paths:
  /documents/search:
    get:
      operationId: searchDocuments
      parameters:
        - name: target_name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: q
          in: query
          schema:
            type: string
            maxLength: 1000
        - name: from
          in: query
          description: Inclusive UTC timestamp used to select overlapping target periods.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive UTC timestamp used to select overlapping target periods.
          schema:
            type: string
            format: date-time
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Documents from published indexes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSearchResult'
        '400':
          description: Invalid query.
        '500':
          description: Query provider failure.
components:
  schemas:
    DocumentSearchResult:
      type: object
      required: [hits, offset, limit, has_more, published_index_count]
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/DocumentHit'
        offset:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        published_index_count:
          type: integer
    DocumentHit:
      type: object
      required: [indexer_id, target_id, uid, score, document]
      properties:
        indexer_id:
          type: integer
        target_id:
          type: integer
        uid:
          type: string
        score:
          type: number
          format: double
        document:
          type: object
          additionalProperties: true
