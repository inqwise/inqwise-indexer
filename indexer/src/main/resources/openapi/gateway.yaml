openapi: 3.0.3
info:
  title: inqwise-indexer gateway API
  version: 0.1.0
paths:
  /gateway/status:
    get:
      operationId: gatewayStatus
      responses:
        '200':
          description: Gateway status.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/GatewayError'
  /gateway/admin/targets:
    get:
      operationId: gatewayListTargets
      parameters:
        - $ref: '#/components/parameters/IdQuery'
        - name: target_name
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: provisioning_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Target list.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/GatewayError'
  /gateway/admin/indexers:
    get:
      operationId: gatewayListIndexers
      parameters:
        - $ref: '#/components/parameters/IdQuery'
        - name: target_id
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: role
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: provisioning_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: runtime_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: publication_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: mutation_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Indexer list.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/GatewayError'
components:
  responses:
    GatewayError:
      description: Safe public gateway error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
  parameters:
    IdQuery:
      name: id
      in: query
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
  schemas:
    GatewayError:
      type: object
      required:
        - code
        - group
        - status
        - detail
      properties:
        code:
          type: string
        group:
          type: string
          enum:
            - gateway
        status:
          type: integer
        detail:
          type: string
