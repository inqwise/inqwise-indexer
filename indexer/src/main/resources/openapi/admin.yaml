openapi: 3.0.3
info:
  title: inqwise-indexer admin API
  version: 0.1.0
paths:
  /admin/targets:
    get:
      operationId: listTargets
      parameters:
        - $ref: '#/components/parameters/IdQuery'
        - name: target_name
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: provisioning_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Target list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTargetList'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_name
                - date
              properties:
                target_name:
                  type: string
                date:
                  type: string
                  format: date
                create_indexer:
                  type: object
                  required:
                    - initial_publication_mode
                  properties:
                    initial_publication_mode:
                      type: string
      responses:
        '201':
          description: Created target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTargetResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/targets/{id}:
    get:
      operationId: getTarget
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTargetResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/targets/{id}/recover-provisioning:
    post:
      operationId: recoverTargetProvisioning
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ExpectedVersionQuery'
      responses:
        '200':
          description: Recovered target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTargetResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/indexers:
    get:
      operationId: listIndexers
      parameters:
        - $ref: '#/components/parameters/IdQuery'
        - name: target_id
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: role
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: provisioning_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: runtime_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: publication_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: mutation_state
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Indexer list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIndexerList'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createIndexer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_id
              properties:
                target_id:
                  type: integer
      responses:
        '201':
          description: Created indexer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIndexerResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/indexers/{id}:
    get:
      operationId: getIndexer
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Indexer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIndexerResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteIndexer
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ExpectedVersionQuery'
      responses:
        '202':
          description: Indexer deletion accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIndexerResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/indexers/{id}/activate:
    post:
      operationId: activateIndexer
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ExpectedVersionQuery'
      responses:
        '200':
          description: Activated indexer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIndexerResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/indexers/{id}/deactivate:
    post:
      operationId: deactivateIndexer
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ExpectedVersionQuery'
      responses:
        '200':
          description: Deactivated indexer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIndexerResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/indexers/{id}/reset-queue:
    post:
      operationId: resetIndexerQueue
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ExpectedVersionQuery'
      responses:
        '200':
          description: Indexer with reset queue name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIndexerResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  responses:
    ErrorResponse:
      description: Structured request or service failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdQuery:
      name: id
      in: query
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
    ExpectedVersionQuery:
      name: expected_version
      in: query
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    AdminTargetList:
      type: object
      required:
        - targets
      properties:
        targets:
          type: array
          items:
            $ref: '#/components/schemas/AdminTargetView'
    AdminTargetResult:
      type: object
      required:
        - target
      properties:
        target:
          $ref: '#/components/schemas/AdminTargetView'
    AdminTargetView:
      type: object
      required:
        - id
        - uid
        - target_name
        - period_key
        - period_start_inclusive
        - period_end_exclusive
        - status
        - provisioning_state
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: integer
        uid:
          type: string
        target_name:
          type: string
        period_key:
          type: string
          nullable: true
        period_start_inclusive:
          type: string
          format: date-time
          nullable: true
        period_end_exclusive:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/TargetStatus'
        provisioning_state:
          $ref: '#/components/schemas/TargetProvisioningState'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    AdminIndexerList:
      type: object
      required:
        - indexers
      properties:
        indexers:
          type: array
          items:
            $ref: '#/components/schemas/AdminIndexerView'
    AdminIndexerResult:
      type: object
      required:
        - indexer
      properties:
        indexer:
          $ref: '#/components/schemas/AdminIndexerView'
    AdminIndexerView:
      type: object
      required:
        - id
        - uid
        - target_id
        - target_name
        - index_name
        - queue_name
        - type
        - role
        - index_ownership
        - status
        - provisioning_state
        - runtime_state
        - publication_state
        - mutation_state
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: integer
        uid:
          type: string
        target_id:
          type: integer
        target_name:
          type: string
        index_name:
          type: string
        queue_name:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/IndexerType'
        role:
          $ref: '#/components/schemas/IndexerRole'
        index_ownership:
          $ref: '#/components/schemas/IndexResourceOwnership'
        status:
          $ref: '#/components/schemas/IndexerStatus'
        provisioning_state:
          $ref: '#/components/schemas/IndexerProvisioningState'
        runtime_state:
          $ref: '#/components/schemas/IndexerRuntimeState'
        publication_state:
          $ref: '#/components/schemas/PublicationState'
        mutation_state:
          $ref: '#/components/schemas/MutationState'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    TargetStatus:
      type: string
      enum:
        - ACTIVE
        - NON_ACTIVE
        - DELETED
    TargetProvisioningState:
      type: string
      enum:
        - READY
        - PROVISIONING
        - FAILED
    IndexerType:
      type: string
      enum:
        - INDEX
    IndexerRole:
      type: string
      enum:
        - LIVE_WRITER
        - LOAD_WRITER
    IndexResourceOwnership:
      type: string
      enum:
        - OWNER
        - ATTACHED
    IndexerStatus:
      type: string
      enum:
        - AVAILABLE
    IndexerProvisioningState:
      type: string
      enum:
        - PROVISIONING
        - READY
        - FAILED
    IndexerRuntimeState:
      type: string
      enum:
        - ACTIVE
        - NON_ACTIVE
    PublicationState:
      type: string
      enum:
        - UNPUBLISHED
        - PUBLISHED
        - RETIRED
    MutationState:
      type: string
      enum:
        - WRITABLE
        - READ_ONLY
        - DELETING
    ErrorBody:
      oneOf:
        - $ref: '#/components/schemas/ErrorTicket'
        - $ref: '#/components/schemas/HttpError'
    ErrorTicket:
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
        group:
          type: string
        id:
          type: string
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    HttpError:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
        message:
          type: string
          nullable: true
