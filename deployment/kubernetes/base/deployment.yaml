apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-node
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inqwise-indexer
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inqwise-indexer
        app.kubernetes.io/component: node
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer-node
          image: inqwise/indexer-node:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          args:
            - com.inqwise.indexer.node.application.IndexerNodeApplicationVerticle
            - --cluster
            - --cluster-host
            - 0.0.0.0
            - --cluster-port
            - "15701"
            - --cluster-public-host
            - $(POD_IP)
            - --cluster-public-port
            - "15701"
            - --options
            - /config/vertx-options.json
            - --conf
            - /config/indexer-node.json
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JAVA_TOOL_OPTIONS
              value: >-
                --add-modules=java.se
                --add-exports=java.base/jdk.internal.ref=ALL-UNNAMED
                --add-opens=java.base/java.lang=ALL-UNNAMED
                --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
                --add-opens=java.management/sun.management=ALL-UNNAMED
                --add-opens=jdk.management/com.sun.management.internal=ALL-UNNAMED
                -Dvertx.hazelcast.config=/config/hazelcast.xml
                -Dindexer.cluster.name=inqwise-indexer-kubernetes
                -Dindexer.cluster.members=indexer-node-headless
                -Dhazelcast.local.localAddress=$(POD_IP)
                -Dhazelcast.local.publicAddress=$(POD_IP):5701
          ports:
            - name: console
              containerPort: 3000
            - name: admin
              containerPort: 8080
            - name: actions
              containerPort: 8081
            - name: runtime
              containerPort: 8083
            - name: health
              containerPort: 8084
            - name: reports
              containerPort: 8086
            - name: metrics
              containerPort: 9090
            - name: hazelcast
              containerPort: 5701
            - name: eventbus
              containerPort: 15701
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: node-config
              mountPath: /config/indexer-node.json
              subPath: indexer-node.json
              readOnly: true
            - name: cluster-config
              mountPath: /config/hazelcast.xml
              subPath: hazelcast.xml
              readOnly: true
            - name: cluster-config
              mountPath: /config/vertx-options.json
              subPath: vertx-options.json
              readOnly: true
      volumes:
        - name: node-config
          configMap:
            name: indexer-node-config
        - name: cluster-config
          configMap:
            name: indexer-cluster-config
